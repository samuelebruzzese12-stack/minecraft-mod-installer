name: Compila APK

# Ogni push compila l'app e pubblica l'APK installabile:
#  - come "artifact" della esecuzione (scheda Actions → esecuzione → Artifacts)
#  - come asset di una "Release" (scheda Releases), più comoda da scaricare dal telefono.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      parts:
        description: "Parti della prova su emulatore da eseguire, separate da virgola (base, mods, catalog, modpack, worlds, convert). Vuoto = tutte"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      parts: ${{ steps.plan.outputs.parts }}

    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Quali parti della prova su emulatore girano dopo la compilazione (ogni parte usa un emulatore per un'ora circa, e i
      # minuti di GitHub Actions di un repository privato sono pochi): lanciando il workflow a mano si scelgono; a ogni push
      # solo «base» più le parti toccate dai file cambiati (tutte se cambia qualcosa di comune).
      - name: Quali parti della prova su emulatore
        id: plan
        env:
          WANT: ${{ inputs.parts }}
          BEFORE: ${{ github.event.before }}
        run: |
          CHANGED=$( (git diff --name-only "$BEFORE" HEAD 2>/dev/null || true) | tr '\n' ' ')
          echo "file cambiati: $CHANGED"
          python3 -I - "$WANT" "$CHANGED" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          allowed = ["base", "mods", "catalog", "modpack", "worlds", "convert"]
          want = [p.strip() for p in (sys.argv[1] if len(sys.argv) > 1 else "").split(",") if p.strip()]
          changed = (sys.argv[2] if len(sys.argv) > 2 else "").split()
          if want:
              parts = [p for p in allowed if p in want] or allowed
          elif not changed:
              parts = allowed
          else:
              own = {
                  "convert": ("mod-converter/", "bytecode/", "ci/convert_phase.sh", "ci/validate_addon.py", "ci/bds_test.py",
                              "JavaToBedrockScreen", "ConvertViewModel", "docs/BLOCKBRIDGE"),
                  "mods": ("mod-manager/", "ci/mods_phase.sh", "ModsScreen", "ModsViewModel"),
                  "catalog": ("catalog/", "ci/catalog_phase.sh", "CatalogScreen", "CatalogViewModel"),
                  "modpack": ("modpack-engine/", "ci/modpack_phase.sh", "ModpackScreen", "ModpackViewModel"),
                  "worlds": ("world-engine/", "ci/worlds_phase.sh", "WorldsScreen", "WorldsViewModel"),
              }
              parts = {"base"}
              for f in changed:
                  hit = [p for p, keys in own.items() if any(k in f for k in keys)]
                  if hit:
                      parts.update(hit)
                  elif f.startswith("docs/") or f.endswith(".md") or f.startswith("ci/fetch_") or f.startswith("app/src/test/"):
                      pass
                  elif f.startswith("app/src/main/"):
                      pass                     # il resto dell'app lo prova «base» (navigazione, sezioni, installer)
                  else:
                      parts.update(allowed)   # moduli comuni, Gradle, il workflow: tutte
              parts = [p for p in allowed if p in parts]
          print("parts=" + json.dumps(parts))
          PY
          grep parts= "$GITHUB_OUTPUT"

      - name: Installa Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installa Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Controlla l'SDK Android
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true

      # Gli stessi file Java che la prova su emulatore mette sul telefono: il test EmulatorSamplesTest li legge con l'analizzatore
      # e il gestore dei profili veri, così le attese dello script (pronto, bloccato, serve conferma…) sono controllate qui.
      - name: Crea i file di prova per il test sui file Java
        run: python3 ci/make_samples.py samples-test

      # Il finto Modrinth della prova su emulatore (ci/dl_server.py --modrinth): lo stesso server, con gli stessi dati. Qui lo provano
      # i test FakeModrinthChainTest (catalogo) ed EmulatorModpackSamplesTest (modpack) con i motori veri; se i dati non tornano si
      # vede subito, prima di spendere l'emulatore.
      - name: Avvia il finto Modrinth per i test del catalogo
        run: |
          mkdir -p fake-modrinth-out
          nohup python3 -I ci/dl_server.py --port 8765 --payload samples-test/Texture_Verde.mcpack --modrinth samples-test --out fake-modrinth-out > fake-modrinth-out/stdout.txt 2>&1 &
          for i in $(seq 1 30); do
            if python3 -I -c "import socket; socket.create_connection(('127.0.0.1', 8765), 1).close()" 2>/dev/null; then break; fi
            sleep 0.5
          done
          cat fake-modrinth-out/stdout.txt
          curl -s "http://127.0.0.1:8765/modrinth/v2/search?query=&facets=%5B%5B%22project_type%3Amod%22%5D%5D" | head -c 300; echo

      - name: Esegui i test (analisi, download e testi dell'app)
        id: coretests
        continue-on-error: true
        env:
          MMI_SAMPLES: ${{ github.workspace }}/samples-test
          MMI_FAKE_MODRINTH: http://127.0.0.1:8765/modrinth/v2
          # Per EmulatorModpackSamplesTest (modpack di prova della parte «modpack» dell'emulatore). Il server va appena avviato: un file
          # dei modpack di prova risponde 404 solo alla prima richiesta.
          MMI_FAKE_SERVER: http://127.0.0.1:8765
        run: gradle :core:test :download-engine:test :jar-analyzer:test :mod-manager:test :catalog:test :modpack-engine:test :world-engine:test :bytecode:test :mod-converter:test :app:testDebugUnitTest --continue --stacktrace

      # Prova COL SERVIZIO VERO: le richieste e le risposte reali di Modrinth (ricerca con i filtri, versioni, dipendenze), un
      # download vero dal suo CDN con verifica dell'impronta, la lettura del .jar scaricato e l'installazione in un profilo; poi
      # i MODPACK veri: i .mrpack dei modpack Fabric più scaricati letti e pianificati, e il più piccolo installato per intero.
      # In sola lettura (solo richieste GET). Non blocca nulla: se la rete o il servizio non rispondono il passaggio fallisce
      # e basta. L'esito e i resoconti compaiono nel riepilogo dell'esecuzione e nella Release.
      - name: Prova col servizio vero (Modrinth)
        id: online
        continue-on-error: true
        env:
          MMI_ONLINE: "1"
          MMI_ONLINE_REPORT: ${{ github.workspace }}/online-report.txt
          MMI_ONLINE_MODPACK_REPORT: ${{ github.workspace }}/online-modpack-report.txt
        run: >-
          gradle :catalog:test --tests 'com.mmi.modinstaller.catalog.OnlineModrinthTest' --rerun
          :modpack-engine:test --tests 'com.mmi.modinstaller.modpack.OnlineModpackTest' --rerun
          --continue --stacktrace

      # JAVA TO BEDROCK con MOD VERE: alcune mod scaricate da Modrinth (contenuto, creature GeckoLib, solo codice, librerie) vengono
      # convertite con il motore vero e gli add-on controllati con gli schemi JSON ufficiali di Mojang (bedrock-samples) e con i
      # controlli sui riferimenti di ci/validate_addon.py. Non blocca nulla; il resoconto va nel riepilogo e nella Release.
      - name: Schemi ufficiali di Minecraft Bedrock (Mojang/bedrock-samples)
        id: schemas
        continue-on-error: true
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/Mojang/bedrock-samples.git bedrock-samples
          cd bedrock-samples && git sparse-checkout set --no-cone '/metadata/json_schemas/*' '/metadata/vanilladata_modules/*' '/version.json'
          python3 -c "import json; print('bedrock-samples', json.load(open('version.json'))['latest'])"
          pip install --quiet jsonschema

      - name: Prova di conversione con mod vere (Modrinth)
        id: convert
        continue-on-error: true
        env:
          MMI_REAL_MODS: ${{ github.workspace }}/real-mods
          MMI_REAL_OUT: ${{ github.workspace }}/real-mods-out
        run: |
          python3 -I ci/fetch_real_mods.py real-mods
          gradle :mod-converter:test --tests 'com.mmi.modinstaller.convert.RealModsTest' --rerun --stacktrace
          {
            cat real-mods/mod-scaricate.txt; echo
            cat real-mods-out/rapporto.txt; echo
            echo "== Controllo degli add-on con gli schemi ufficiali di Mojang"
            python3 -I ci/validate_addon.py bedrock-samples real-mods-out/*.mcaddon
          } > convert-online-report.txt 2>&1; status=$?
          cat convert-online-report.txt
          exit $status

      - name: Conserva gli add-on convertiti (per le prove nel server Bedrock)
        if: steps.convert.outcome != 'skipped'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: addon-convertiti
          path: real-mods-out/*.mcaddon
          if-no-files-found: ignore
          retention-days: 7

      - name: Riepilogo della prova col servizio vero
        if: always()
        continue-on-error: true
        run: |
          {
            echo "## Prova col servizio vero (Modrinth): ${{ steps.online.outcome }}"
            if [ -f online-report.txt ]; then
              echo '```'
              cat online-report.txt
              echo '```'
            else
              echo "(nessun resoconto: la prova non è partita)"
            fi
            echo "### JAVA TO BEDROCK con mod vere: ${{ steps.convert.outcome }}"
            if [ -f convert-online-report.txt ]; then
              echo '```'
              cat convert-online-report.txt
              echo '```'
            else
              echo "(nessun resoconto della conversione)"
            fi
            echo "### Modpack veri"
            if [ -f online-modpack-report.txt ]; then
              echo '```'
              cat online-modpack-report.txt
              echo '```'
            else
              echo "(nessun resoconto dei modpack: la prova non è partita)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          cp online-report.txt catalog-online-report.txt 2>/dev/null || true
          cp online-modpack-report.txt modpack-online-report.txt 2>/dev/null || true

      - name: Compila l'APK
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Raccogli gli APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/MinecraftModInstaller.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/MinecraftModInstaller-debug.apk
          ls -l dist

      - name: Riepilogo dell'APK (firma, permessi, impronta)
        continue-on-error: true
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          {
            echo "## APK compilato"
            echo
            echo "- Test: ${{ steps.coretests.outcome }}"
            echo "- Dimensione: $(du -h dist/MinecraftModInstaller.apk | cut -f1)"
            echo "- SHA-256: \`$(sha256sum dist/MinecraftModInstaller.apk | cut -d' ' -f1)\`"
            echo
            echo "### Firma"
            echo '```'
            "$BT/apksigner" verify --print-certs dist/MinecraftModInstaller.apk 2>&1 | head -n 8
            echo '```'
            echo "### Permessi (atteso: solo INTERNET, per il DOWNLOAD MANAGER, e il permesso interno di AndroidX a livello firma)"
            echo '```'
            "$BT/aapt2" dump permissions dist/MinecraftModInstaller.apk 2>&1 | head -n 20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # La versione normale scarica solo con https. L'eccezione per l'HTTP verso 10.0.2.2 (prova su emulatore) esiste solo
      # nella versione di prova (debug): se compare nella versione normale, la compilazione si ferma.
      - name: Controlla che la versione normale non ammetta traffico non cifrato
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml dist/MinecraftModInstaller.apk > manifest-release.txt 2>&1 || true
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml dist/MinecraftModInstaller-debug.apk > manifest-debug.txt 2>&1 || true
          if ! grep -q "uses-permission" manifest-release.txt; then
            echo "Non riesco a leggere il manifest della versione normale: controllo saltato"; head -n 20 manifest-release.txt; exit 0
          fi
          {
            echo "### Traffico di rete"
            if grep -Eqi "networkSecurityConfig|usesCleartextTraffic" manifest-release.txt; then
              echo "- **ERRORE**: la versione normale ha una configurazione di rete che può ammettere il traffico non cifrato"
            else
              echo "- Versione normale: nessuna eccezione, solo https (il sistema blocca l'HTTP in chiaro)"
            fi
            if grep -Eqi "networkSecurityConfig" manifest-debug.txt; then
              echo "- Versione di prova (debug): ammette HTTP solo verso 10.0.2.2, per la prova su emulatore"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -Eqi "networkSecurityConfig|usesCleartextTraffic" manifest-release.txt; then
            grep -Ei "networkSecurityConfig|usesCleartextTraffic" manifest-release.txt
            echo "ERRORE: la versione normale può ammettere traffico non cifrato"; exit 1
          fi
          echo "OK: la versione normale non ammette traffico non cifrato"

      - name: Pubblica gli APK come artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinecraftModInstaller-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Salva i rapporti dei test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapporti-test
          path: |
            core/build/reports/tests/test
            download-engine/build/reports/tests/test
            jar-analyzer/build/reports/tests/test
            mod-manager/build/reports/tests/test
            catalog/build/reports/tests/test
            modpack-engine/build/reports/tests/test
            world-engine/build/reports/tests/test
            mod-converter/build/reports/tests/test
            convert-online-report.txt
            catalog-online-report.txt
            modpack-online-report.txt
            fake-modrinth-out
            app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Crea la Release con l'APK
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Minecraft Mod Installer — build ${{ github.run_number }}
          body: |
            APK installabile (firmato). Scaricalo dal telefono e aprilo: Android chiederà di consentire
            l'installazione da questa fonte.

            - `MinecraftModInstaller.apk` — versione normale
            - `MinecraftModInstaller-debug.apk` — stessa app con le informazioni di debug
          files: |
            dist/*.apk
            catalog-online-report.txt
            modpack-online-report.txt
            convert-online-report.txt

      # Il finto Minecraft serve solo alla prova su emulatore: non entra mai nella Release.
      # Questi passaggi non possono bloccare la consegna dell'APK (vengono dopo e non fanno fallire l'esecuzione).
      - name: Compila il finto Minecraft (solo per la prova su emulatore)
        continue-on-error: true
        run: gradle -PwithFakeMinecraft :fakeminecraft:assembleDebug --stacktrace

      - name: Salva il finto Minecraft per la prova
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: fakeminecraft-apk
          path: ci/fakeminecraft/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

  # Prova l'APK appena compilato su un emulatore Android: schermate, pulsanti, apertura di file di prova.
  # Non blocca la consegna dell'APK (continue-on-error): serve a trovare i difetti che la compilazione non vede.
  #
  # L'emulatore del runner (2 core) è lentissimo: ogni passaggio dura decine di secondi. Tutta la prova di fila superava l'ora e mezza,
  # quindi si divide in parti che girano in parallelo, ciascuna con il suo emulatore:
  #   base    = installer Bedrock, sezioni, impostazioni, download, finto Minecraft, arresto provocato, aggiornamento sopra la versione 5;
  #   mods    = MOD MANAGER (profili, installazione, interruttore, annulla, verifica, raccolte, esportazione);
  #   catalog = CERCA ONLINE (catalogo Modrinth, con il finto servizio di ci/dl_server.py); si prepara da sé il profilo di partenza;
  #   modpack = MODPACK MANAGER (modpack .mrpack di prova: completo, incompleto e ripresa, annullamento, consenso, DOWNLOAD MANAGER);
  #   worlds  = WORLD MANAGER (mondo Java importato ed esportato, avviso di versione, app chiusa a metà e RIPRENDI, mondo Bedrock).
  emulator:
    name: Prova su emulatore Android (${{ matrix.part }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.build.outputs.parts) }}

    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Abilita l'accelerazione KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "KVM NON DISPONIBILE"
          nproc
          free -m | head -n 2

      - name: Scarica l'APK compilato
        uses: actions/download-artifact@v4
        with:
          name: MinecraftModInstaller-apk
          path: apk

      - name: Scarica il finto Minecraft
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: fakeminecraft-apk
          path: fake

      # La versione precedente (build 5: l'ultima con il solo INSTALLER BEDROCK) serve alla prova di aggiornamento:
      # l'emulatore la installa, ci lavora, poi installa sopra quella nuova e controlla che i dati restino.
      # Se non si riesce a scaricarla la prova di aggiornamento viene saltata e il rapporto lo dice.
      - name: Scarica la versione precedente (per la prova di aggiornamento)
        if: matrix.part == 'base'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_TAG: build-5
        run: |
          mkdir -p baseline
          gh release download "$BASELINE_TAG" --repo "$GITHUB_REPOSITORY" --pattern MinecraftModInstaller-debug.apk --dir baseline
          ls -l baseline

      - name: Crea i file di prova
        run: python3 ci/make_samples.py samples

      # La parte «convert» controlla l'add-on creato sul telefono con gli schemi ufficiali di Mojang.
      - name: Schemi ufficiali di Minecraft Bedrock (per la parte «convert»)
        if: matrix.part == 'convert'
        continue-on-error: true
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/Mojang/bedrock-samples.git bedrock-samples
          cd bedrock-samples && git sparse-checkout set --no-cone '/metadata/json_schemas/*' '/metadata/vanilladata_modules/*'
          pip install --quiet jsonschema

      # Il runner di GitHub ha solo 2 core: con l'immagine «google_apis» (servizi di Google, Pixel Launcher) l'emulatore andava spesso in
      # blocco con finestre «… non risponde». Il primo tentativo usa l'immagine di base di Android (senza servizi di Google), più leggera.
      - name: Prova l'app sull'emulatore (primo tentativo)
        id: emu1
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          disable-animations: true
          emulator-boot-timeout: 900
          script: SMOKE_PART=${{ matrix.part }} BEDROCK_SAMPLES=${{ github.workspace }}/bedrock-samples bash ci/emulator_smoke.sh

      # Si ripete SOLO se l'emulatore era inutilizzabile (lo script lascia EMULATORE_INUTILIZZABILE e termina con il codice 3) o non è
      # nemmeno partito (manca problemi.txt). Se la prova ha trovato difetti veri NON si ripete: il risultato resta quello.
      - name: Il primo tentativo va ripetuto?
        id: retry
        if: always()
        run: |
          again=no
          if [ "${{ steps.emu1.outcome }}" != "success" ]; then
            if [ -f ci-out/EMULATORE_INUTILIZZABILE ] || [ ! -f ci-out/problemi.txt ]; then again=yes; fi
          fi
          echo "Primo tentativo: ${{ steps.emu1.outcome }}; da ripetere: $again"
          echo "again=$again" >> "$GITHUB_OUTPUT"
          if [ "$again" = yes ] && [ -d ci-out ]; then mv ci-out ci-out-tentativo1; fi

      - name: Prova l'app sull'emulatore (secondo tentativo, con i servizi di Google)
        if: steps.retry.outputs.again == 'yes'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          disable-animations: true
          emulator-boot-timeout: 900
          script: SMOKE_PART=${{ matrix.part }} BEDROCK_SAMPLES=${{ github.workspace }}/bedrock-samples bash ci/emulator_smoke.sh

      - name: Salva schermate e log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prova-emulatore-${{ matrix.part }}
          path: |
            ci-out
            ci-out-tentativo1
          if-no-files-found: warn

      # Gli artifact si scaricano solo dal sito di GitHub: lo stesso materiale viene allegato anche alla Release.
      - name: Comprimi i risultati della prova
        if: always()
        run: |
          dirs=""
          for d in ci-out ci-out-tentativo1; do [ -d "$d" ] && dirs="$dirs $d"; done
          if [ -n "$dirs" ]; then zip -qr prova-emulatore-${{ matrix.part }}.zip $dirs; fi
          ls -l prova-emulatore-${{ matrix.part }}.zip || true

      - name: Allega i risultati alla Release
        if: always()
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: prova-emulatore-${{ matrix.part }}.zip

  # Prove nel gioco vero: il server Bedrock ufficiale di Mojang carica gli add-on delle mod vere e un giocatore simulato
  # piazza blocchi, apre porte, mangia, scava; le creature devono nascere vive. Non blocca la consegna dell'APK.
  bds:
    name: Prove nel server Bedrock ufficiale
    needs: build
    # Solo quando cambia il convertitore (la parte «convert»): costa circa un'ora di minuti.
    if: contains(needs.build.outputs.parts, 'convert')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    continue-on-error: true
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Scarica gli add-on convertiti
        id: addons
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: addon-convertiti
          path: real-mods-out

      - name: Server Bedrock e prove
        id: bds
        if: steps.addons.outcome == 'success'
        continue-on-error: true
        run: |
          python3 -I ci/fetch_bds.py bds
          python3 -I ci/bds_test.py bds bds-out real-mods-out/*.mcaddon; status=$?
          {
            echo "== Prove nel server Bedrock ufficiale (Bedrock Dedicated Server di Mojang, con un giocatore simulato)"
            echo "Usare il server Bedrock implica accettare l'EULA di Minecraft e l'informativa sulla privacy di Microsoft."
            cat bds-out/riepilogo.txt
          } > bds-report.txt 2>&1
          cat bds-report.txt
          exit $status

      - name: Riepilogo
        if: always()
        run: |
          {
            echo "## Prove nel gioco vero (server Bedrock ufficiale): ${{ steps.bds.outcome }}"
            if [ -f bds-report.txt ]; then echo '```'; cat bds-report.txt; echo '```'; else echo "(le prove non sono partite)"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Salva i risultati
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prove-server-bedrock
          path: |
            bds-report.txt
            bds-out
          if-no-files-found: ignore

      - name: Allega il rapporto alla Release
        if: github.event_name != 'pull_request' && steps.bds.outcome != 'skipped'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: bds-report.txt
